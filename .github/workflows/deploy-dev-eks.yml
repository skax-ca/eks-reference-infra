# live/dev/eks: plan(main push) → 사람이 그 run의 요약을 읽고 승인 → 같은 run이 apply
#
# deploy-hub-eks.yml과 같은 규약을 spoke EKS 루트에 적용한다. 설계 원칙(environment 승인이 게이트, 한 워크플로
# 두 job, plan job에 environment 없음, apply는 tofu apply tfplan, destroy 경로, replace 입력)은
# deploy-hub-network.yml·deploy-hub-eks.yml 헤더가 근거를 설명한다.
#
# ⚠️ deletion_protection이 켜져 있으면 파기는 2단계다. false로 apply한 뒤 destroy한다.

name: deploy · live/dev/eks

on:
  push:
    branches: [main]
    paths:
      - live/dev/eks/**
      - .github/workflows/deploy-dev-eks.yml
  # merge 후 plan이 돌고 apply는 승인을 기다린다(요약은 run Summary 탭). dispatch는 destroy·replace 경로다.
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기 / plan = 확인만(적용하지 않는다)"
        type: choice
        options: [apply, destroy, plan]
        default: apply
      confirm:
        description: "destroy 일 때만 필수. 정확히 `destroy live/dev/eks` 를 입력한다"
        type: string
        default: ""
      # 재생성 경로. user_data는 부팅 시에만 돌기 때문에 부팅 당시 조건이 틀렸던 인스턴스는
      # apply로 고칠 수 없고 교체해야만 코드가 상태를 되찾는다.
      # ⚠️ 교체는 파괴를 포함하므로 plan 요약의 must be replaced로 승인자에게 드러난다.
      replace:
        description: "재생성할 리소스 주소(선택). 예: module.workbench.aws_instance.this"
        type: string
        default: ""

# state는 단일 자원이다. 두 run이 겹치면 lock 경합이거나, 더 나쁘게는 뒤늦은 run이 오래된
# plan을 적용한다.
# ⛔ cancel-in-progress는 false여야 한다. apply 중인 run을 취소하면 state와 실제가 갈라진다.
concurrency:
  group: live-dev-eks
  cancel-in-progress: false

env:
  TF_ROOT: live/dev/eks
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  # plan: main push와 dispatch 양쪽에서 돈다. environment를 선언하지 않는다. 요약은 승인자가
  # 읽으라고 남기고, 적용은 그 요약을 읽고 승인한 뒤 같은 run 안에서 일어난다.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      # apply 가드가 읽는다. plan 스텝이 -detailed-exitcode 로 판정한 값이다.
      changes: ${{ steps.plan.outputs.changes }}
    permissions:
      id-token: write # OIDC JWT 발급. 이게 없으면 1단 인증 자체가 안 된다
      contents: read
      # pull-requests: write는 두지 않는다. PR 댓글 step이 없으므로 필요 없는 쓰기 권한이다.

    steps:
      # destroy 확인 게이트. 공용 개발 계정이고 destroy는 되돌릴 수 없다. 루트 이름을 손으로
      # 적게 해 "누른 워크플로 = 지우려던 워크플로"를 사람이 스스로 확인하게 만든다.
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/dev/eks" ]; then
            echo "::error::destroy 하려면 confirm 에 정확히 'destroy live/dev/eks' 를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다: live/dev/eks"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다. 기본값 true 는 tofu 호출을 래퍼로 감싸 stdout·stderr·exitcode 를
      #    스텝 출력으로 내보내는데, 그 과정에서 -detailed-exitcode 의 2 가 스텝 종료 코드로
      #    전달되지 않는다. 아래 plan 스텝이 code=0 으로 읽어 changes=false 를 내보내고, 변경이
      #    있어도 apply 가 skipped 로 끝난다. 액션 문서도 exit code 가 이상하면 이 값을 false 로
      #    두라고 적는다. verify.yml 이 같은 값을 쓴다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # OIDC 2단 체인의 1단. 입구 Role의 권한은 "실행 Role을 assume" 하나뿐이다. 정적 키는
      # 어디에도 없다.
      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEV_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-plan-${{ github.run_id }}

      # partial backend configuration. 버킷명이 코드에 없어 여기서 repo 변수로 조립한다.
      # ⚠️ backend는 provider와 독립적으로 자격증명을 해결한다. provider의 assume_role은 backend에
      #    적용되지 않고, 입구 Role의 권한은 sts:AssumeRole 하나뿐이라 그대로 두면 state를 읽다가
      #    403이 난다. backend에도 같은 실행 Role을 체인 assume 시켜야 "입구 Role의 권한은 assume
      #    하나뿐"이라는 신뢰 경계가 유지된다.
      # ⚠️ 파일로 넘긴다. -backend-config=KEY=VALUE는 문자열 값만 받아 assume_role 객체를 CLI
      #    플래그로 표현할 수 없다. backend.hcl은 .gitignore 대상이라 runner에 만들어도 커밋될 수 없다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.DEV_TF_STATE_BUCKET }}"
          key          = "dev/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.DEV_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔ registry 간
        # 네트워크 지연). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          # 2단째 assume 대상. ARN에 계정 ID가 있어 코드에 두지 않는다.
          TF_VAR_execution_role_arn: ${{ vars.DEV_AWS_EXEC_ROLE_ARN }}
          # cross-account-trust-role의 trusted_principal_arns를 결정적으로 합성하는 데만 쓴다. 계정 ID라
          # 코드에 두지 않는다.
          TF_VAR_hub_account_id: ${{ vars.HUB_ACCOUNT_ID }}
        run: |
          # -detailed-exitcode: 0=변경없음 · 1=오류 · 2=변경있음. "두 번째 apply가 No changes인가"
          # (ignore_tags 판정)를 사람 눈이 아니라 종료 코드로 받기 위해 쓴다.
          # push 이벤트에는 inputs가 없다 → 빈 문자열이므로 자동으로 apply 경로다.
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          # 재생성. 비어 있으면 아무 영향이 없다. destroy와 겹칠 일은 없다(파기에 교체는 무의미).
          REPLACE=""
          if [ -n "${{ inputs.replace }}" ] && [ "${{ inputs.action }}" != "destroy" ]; then
            REPLACE="-replace=${{ inputs.replace }}"
            echo "::warning::재생성 계획: ${{ inputs.replace }}"
          fi

          set +e
          tofu plan $DESTROY $REPLACE -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # "삭제 대상은 사람이 검토한다"를 이행하는 지점. 공용 계정이라 예외가 없다. destroy/replace를
      # 전문 위로 끌어올려 스크롤하지 않아도 보이게 만든다. 요약은 $GITHUB_STEP_SUMMARY에 무조건
      # 쓰므로 push run·dispatch run 어느 쪽에서도 run의 Summary 탭에서 읽을 수 있다.
      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\`: live/dev/eks"
              echo
              echo "> **파기 계획이다.** 이 run 의 apply 를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\`: live/dev/eks"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            if [ "${{ inputs.action }}" = "plan" ]; then
              echo
              echo "> 확인 전용 실행이다(\`action=plan\`). 변경이 있어도 apply 하지 않는다."
            fi
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ plan 파일에는 리소스 속성이 평문으로 들어간다. repo read 권한자가 받을 수 있으므로
      #    보관을 하루로 제한한다. 이는 완화이지 해결이 아니다.
      - name: plan artifact 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 7
          if-no-files-found: error

  # apply: plan 뒤 environment 승인을 기다린다. push·dispatch 모두 같은 경로다.
  apply:
    name: apply
    needs: plan
    # 승인 게이트는 environment의 required reviewers다. push든 dispatch든 plan 뒤에 멈춘다.
    # ⚠️ 브랜치 조건: workflow_dispatch는 임의 브랜치에서 눌릴 수 있다. Environment의 deployment
    #    branch policy(main 하나)가 최종 방어선이지만, job 조건으로도 막아 두면 실패가 아니라
    #    skip으로 끝난다.
    # ⚠️ changes 가드: 변경 0건이면 apply 를 건너뛴다. 빈 승인 클릭을 없애고, 승인 게이트가
    #    섰다는 사실 자체를 "적용할 것이 있다"는 신호로 만든다. destroy 는 항상 changes=true 다.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.plan.outputs.changes == 'true'
      && inputs.action != 'plan'
    runs-on: ubuntu-latest
    # 이 한 줄이 두 가지를 동시에 한다: 승인 게이트(protection rules가 걸려 있을 때)와 OIDC
    # sub를 ...:environment:dev로 바꾸는 것(입구 Role 신뢰 정책의 SUB_ENV_SPOKE 패턴).
    # ⚠️ environment는 sub에서 ref를 덮어쓴다. 그래서 브랜치 제한을 sub로 걸 수 없고 Environment의
    #    deployment branch policy가 그 자리를 맡는다.
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      # checkout·setup·인증은 plan job과 같다. 자격증명은 job 간에 이동하지 않으므로 재수행한다
      # (중복이 아니라 격리). 승인 대기 중 세션(최대 1시간, 연장 불가)이 만료돼도 apply job이 새로
      # 인증하므로 승인 지연 자체는 문제가 되지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다(plan job 과 같은 근거). 이 job 의 apply 후 수렴 검증도
      #    -detailed-exitcode 로 판정하므로, 래퍼가 켜져 있으면 미수렴을 잡지 못한다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEV_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-apply-${{ github.run_id }}

      # plan job과 같은 이유로 backend도 실행 Role을 체인 assume한다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.DEV_TF_STATE_BUCKET }}"
          key          = "dev/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.DEV_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔ registry 간
        # 네트워크 지연). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      # 같은 run의 artifact다. run 경계를 넘지 않는 것이 이 설계의 핵심이다.
      - name: plan artifact 내려받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      # ⛔ tofu apply(인자 없이)로 바꾸면 재-plan이 되어 승인 대상과 달라진다. TF_VAR_*를 여기
      #    넘기지 않는다. 저장된 plan은 변수 값을 이미 품고 있고, 다시 넘기면 "승인한 계획"의
      #    정의가 흐려진다.
      # ⚠️ 승인 대기 중 state가 바뀌었으면 이 명령이 거부한다(정상 동작). 그때는 재-plan이
      #    필요하다(=새 run).
      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\`: live/dev/eks"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-eks-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
