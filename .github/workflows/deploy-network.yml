# live/dev/networking — plan → (사람이 실행) → plan → apply
#
# ── 2026-08-03 개정: PR plan 제거 + apply 는 수동 트리거 ──────────────────────
#
# **왜 PR plan 을 뺐나**: PR 에서 plan, merge 에서 다시 plan→apply 로 같은 계산을 두 번 하고
# 그만큼 배포가 느렸다. 사용자 결정으로 PR 단계를 걷어냈다.
#
# ⚠️ **그래서 apply 를 자동에서 수동으로 바꿨다.** 뺀 것이 PR plan **댓글**만이 아니기 때문이다 —
#    이 org 는 **free 플랜**이라 private repo 의 environment 에 required reviewers 를 걸 수 없다
#    (실측 2026-08-03: dev environment 의 protection_rules 는 `branch_policy` 뿐).
#    즉 승인 게이트가 **아직 존재하지 않고**, PR 의 plan 댓글이 사람이 계획을 보는 유일한
#    지점이었다. 그것만 없애면 **아무도 읽지 않은 계획이 AdministratorAccess(D27-1)로 공용
#    개발 계정(F13)에 적용된다** — D27-2 의 "destroy/replace 를 사람이 읽는다(예외 없음)" 위반.
#    → `workflow_dispatch` 를 누르는 행위가 무료 플랜에서 승인을 대신한다.
#
# 🔑 **상위 요금제 구독 시 되돌릴 것**: apply 의 `if:` 에서 `workflow_dispatch` 제약을 풀고
#    `push` 를 복원한 뒤, environment `dev` 에 required reviewers 를 건다. 그러면 승인이
#    **같은 run 안**으로 들어와 아래 ⚠️ 의 잔여 간극도 함께 사라진다.
#
# ⚠️ **잔여 간극(수동 트리거 방식의 한계)**: merge 시 push run 이 만든 plan 을 사람이 읽고,
#    dispatch run 은 **자기 plan 을 새로 만들어** 적용한다. 그 사이 state 가 바뀌면 읽은 것과
#    적용되는 것이 달라질 수 있다. run 경계를 넘어 artifact 를 가져오는 것이 더 나쁘므로
#    (아래 ⛔ 첫 항목) 이 구조를 택했고, dispatch run 도 자기 요약을 남겨 사후 확인은 된다.
#
# ⛔ **한 워크플로 두 job 을 유지한다**(design/50 §3). 별도 워크플로로 쪼개면 plan artifact 를
#    run 경계 **밖에서** 찾아야 하고, 그 조회 지점이 곧 "승인한 계획 ≠ 적용된 계획" 구멍이다.
#    같은 run 안이면 `needs:` 가 그 관계를 구조적으로 보장한다.
#
# ⛔ **plan job 에 `environment:` 를 추가하지 않는다**(D28). environment 를 선언한 job 만
#    OIDC `sub` 에 `:environment:<name>` 을 받는다. plan job 에 붙이면 sub 가 바뀌어
#    입구 Role 의 신뢰 정책 3패턴과 어긋난다. 실측된 세 패턴은 docs/deployment-facts.md §3.
#
# ⛔ **apply 를 `tofu apply`(재-plan)로 바꾸지 않는다.** 승인한 것과 다른 것을 적용하게 된다.

name: deploy · live/dev/networking

on:
  # ⛔ pull_request 트리거는 2026-08-03 제거됐다(맨 위 개정 주석). 되살리려면 그 이유부터 읽을 것 —
  #    "PR 에서도 미리 보면 좋지 않나"는 이미 값을 매겨 뺀 안이다(배포 지연).
  push:
    branches: [main]
    paths:
      - live/dev/networking/**
      - .github/workflows/deploy-network.yml
  # merge 후 **plan 까지만** 자동으로 돈다. 요약은 run 의 Summary 탭에 남는다.
  #
  # apply 는 아래 dispatch 로만 일어난다. 그 외에 dispatch 가 필요한 경우도 그대로다:
  #   ① 승인(=dispatch) 대기 중 state 가 바뀌어 apply 가 거부됐을 때(정상 동작이다)
  #   ② drift 확인 — 계정 자동 태거처럼 우리 밖에서 리소스를 만지는 주체가 있다(§5.2)
  # ⚠️ 어느 경우든 **같은 run 안에서** plan → apply 가 이어진다. 별도 apply 워크플로를 만들지 않는다.
  #
  # ── destroy 경로 (2026-08-11 신설) ─────────────────────────────────────────
  # action=destroy 로 파기한다. **plan 만 -destroy 로 갈리고 apply job 은 그대로다** —
  # apply 가 저장된 plan 파일을 적용하는 구조라 파기 계획도 같은 경로로 흐른다(코드 변경 0).
  # 🔑 실행 Role 신뢰가 입구 Role 하나뿐이라(D27-1) **로컬에서는 destroy 를 실행할 수 없다**
  #    (실측: 로컬 IAM user 의 AssumeRole 이 AccessDenied). 파기 경로가 없으면 철수 시
  #    콘솔 수동 삭제밖에 남지 않고, 그러면 state 가 남는다.
  # ⚠️ deletion_protection 이 켜져 있으면 파기는 2단계다 — false 로 apply 한 뒤 destroy 한다.
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기"
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: "destroy 일 때만 필수. 정확히 `destroy live/dev/networking` 를 입력한다"
        type: string
        default: ""

# state 는 단일 자원이다. 두 run 이 겹치면 lock 경합이거나, 더 나쁘게는 뒤늦은 run 이
# 오래된 plan 을 적용한다. cancel-in-progress 는 **false** 여야 한다 —
# apply 중인 run 을 취소하면 state 와 실제가 갈라진다.
concurrency:
  group: live-dev-networking
  cancel-in-progress: false

env:
  TF_ROOT: live/dev/networking
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # plan — main push 와 dispatch 양쪽에서 돈다. environment 를 **선언하지 않는다**(D28).
  # ⚠️ push run 의 plan 은 **사람이 읽으라고** 도는 것이다(적용은 하지 않는다).
  #    적용은 그 요약을 읽은 사람이 dispatch 를 눌렀을 때 그 run 안에서 일어난다.
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC JWT 발급 — 이게 없으면 1단 인증 자체가 안 된다
      contents: read
      # ⚠️ pull-requests: write 는 제거됐다 — PR 댓글 step 과 함께 사라졌다.
      #    필요 없는 쓰기 권한을 남겨 두지 않는다.

    steps:
      # ── destroy 확인 게이트 — 잘못된 워크플로에 dispatch 하는 사고를 막는다 ──
      # 공용 개발 계정이고 destroy 는 되돌릴 수 없다. 루트 이름을 손으로 적게 해
      # "누른 워크플로 = 지우려던 워크플로" 를 사람이 스스로 확인하게 만든다.
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/dev/networking" ]; then
            echo "::error::destroy 하려면 confirm 에 정확히 'destroy live/dev/networking' 를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다 — live/dev/networking"

      - uses: actions/checkout@v7.0.1

      # ── D20 · private repo 모듈 소싱 인증 ──────────────────────────────────
      # 토큰은 1시간 만료이고 접근 범위는 iac-module-library 1개다(실측: repository_selection=selected).
      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      # 소싱 URL 은 코드에서 git::https:// 하나다. 인증은 **여기서만** 주입된다 —
      # 코드가 인증 방식을 모르는 것이 D20 의 facade 원칙이다.
      # ⚠️ insteadOf 값에 토큰이 평문으로 들어간다. runner 의 --global config 는 일회용이라
      #    run 종료와 함께 사라진다(로컬에서 같은 명령을 ~/.gitconfig 에 하면 안 되는 이유).
      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # ── OIDC 2단 체인 · 1단 ────────────────────────────────────────────────
      # 입구 Role 의 권한은 "실행 Role 을 assume" 하나뿐이다. 정적 키는 어디에도 없다.
      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-plan-${{ github.run_id }}

      # ── D25 · partial backend configuration ────────────────────────────────
      # 버킷명이 코드에 없다. 여기서 repo 변수로 조립한다.
      #
      # ⚠️ **backend 는 provider 와 독립적으로 자격증명을 해결한다**(OpenTofu 공식).
      #    provider 의 assume_role 은 backend 에 적용되지 않는다. 입구 Role 의 권한은
      #    `sts:AssumeRole` 하나뿐이라(D27-1) 그대로 두면 state 를 읽다가 403 이 난다 —
      #    2026-07-31 run 30592702396 에서 실제로 그렇게 실패했다.
      #    → backend 에도 **같은 실행 Role 을 체인 assume** 시킨다. 이렇게 해야
      #      "입구 Role 의 권한은 assume 하나뿐"이라는 D27-1 의 신뢰 경계가 유지된다.
      #
      # ⚠️ 파일로 넘기는 이유: `-backend-config=KEY=VALUE` 는 **문자열 값만** 받는다.
      #    assume_role 은 객체라 CLI 플래그로 표현할 수 없다.
      #    파일명 backend.hcl 은 .gitignore 대상이라 runner 에 만들어도 커밋될 수 없다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/networking.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔
        # registry 간 네트워크 지연 — 모듈 repo docs/04-teardown.md §8). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3) — 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          # 2단째 assume 대상. ARN 에 계정 ID 가 있어 코드에 두지 않는다(D25 의 연장).
          TF_VAR_execution_role_arn: ${{ vars.AWS_EXEC_ROLE_ARN }}
        run: |
          # -detailed-exitcode: 0=변경없음 · 1=오류 · 2=변경있음.
          # "두 번째 apply 가 No changes 인가"(ignore_tags 판정)를 사람 눈이 아니라
          # 종료 코드로 받기 위해 쓴다.
          # push 이벤트에는 inputs 가 없다 → 빈 문자열이므로 자동으로 apply 경로다.
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          set +e
          tofu plan $DESTROY -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # ── D27-2 · "삭제 대상 사람 검토"를 이행하는 지점 ─────────────────────
      # 공용 계정(F13)이라 예외가 없다. destroy/replace 를 전문 위로 끌어올려
      # 스크롤하지 않아도 보이게 만든다.
      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\` — live/dev/networking"
              echo
              echo "> **파기 계획이다.** 이 run 의 apply 를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\` — live/dev/networking"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**(D27-2)."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ **"PR 에 plan 댓글" step 은 2026-08-03 제거됐다** — pull_request 트리거가 없어져
      #    죽은 코드가 됐다. 요약은 위 step 이 $GITHUB_STEP_SUMMARY 에 무조건 쓰므로
      #    push run · dispatch run 어느 쪽에서도 run 의 Summary 탭에서 읽을 수 있다.

      # ⚠️ plan 파일에는 리소스 속성이 평문으로 들어간다. repo read 권한자가 받을 수 있으므로
      #    보관을 하루로 제한한다(design/50 §3). 이는 완화이지 해결이 아니다 — 열린 항목 6.
      - name: plan artifact 업로드
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # apply — **workflow_dispatch 에서만**(2026-08-03 개정). main push 에서는 skip 된다.
  # environment: dev 는 sub 패턴 ③의 근원이며, 승인 게이트 역할은 free 플랜에서 아직 못 한다.
  # ────────────────────────────────────────────────────────────────────────────
  apply:
    name: apply
    needs: plan
    # ⭐ **dispatch 를 누르는 행위가 승인이다**(맨 위 개정 주석). free 플랜이라 environment 에
    #    required reviewers 를 걸 수 없어, 사람의 명시적 실행이 그 자리를 대신한다.
    #    → main 에 merge 해도 apply 는 돌지 않는다. plan 요약을 읽고 Run workflow 를 누른다.
    # 🔑 상위 요금제 구독 시: 아래 조건을 `(push || workflow_dispatch)` 로 되돌리고
    #    environment dev 에 required reviewers 를 건다(맨 위 "되돌릴 것").
    # ⚠️ 브랜치 조건을 여기 한 번 더 쓰는 이유: workflow_dispatch 는 임의 브랜치에서 눌릴 수 있다.
    #    Environment 의 deployment branch policy(main 하나)가 최종 방어선이지만,
    #    job 조건으로도 막아 두면 실패가 아니라 skip 으로 끝난다.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ⚠️ 이 한 줄이 두 가지를 동시에 한다:
    #    ① 승인 게이트(protection rules 가 걸려 있을 때)
    #    ② OIDC sub 를 `...:environment:dev` 로 바꾼다 — 신뢰 정책 3번째 패턴
    #    ⚠️ environment 는 sub 에서 ref 를 **덮어쓴다**(Phase 2 실측). 그래서 브랜치 제한을
    #       sub 로 걸 수 없고, Environment 의 deployment branch policy 가 그 자리를 맡는다.
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      # 1~4단계는 plan job 과 같다. **자격증명은 job 간에 이동하지 않으므로** 재수행한다 —
      # 중복이 아니라 격리다. 승인 대기 중 세션(최대 1시간, 연장 불가)이 만료돼도
      # apply job 이 새로 인증하므로 승인 지연 자체는 문제가 되지 않는다.
      - uses: actions/checkout@v7.0.1

      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-apply-${{ github.run_id }}

      # plan job 과 같은 이유로 backend 도 실행 Role 을 체인 assume 한다(위 주석 참조).
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/networking.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔
        # registry 간 네트워크 지연 — 모듈 repo docs/04-teardown.md §8). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3) — 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      # **같은 run** 의 artifact 다. run 경계를 넘지 않는 것이 이 설계의 핵심이다.
      - name: plan artifact 내려받기
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      # ⛔ `tofu apply` (인자 없이) 로 바꾸면 재-plan 이 되어 승인 대상과 달라진다.
      # ℹ️ TF_VAR_* 를 여기 넘기지 않는다. 저장된 plan 은 변수 값을 이미 품고 있고,
      #    다시 넘기면 "승인한 계획"의 정의가 흐려진다.
      # ⚠️ 승인 대기 중 state 가 바뀌었으면 이 명령이 거부한다 — **정상 동작**이다.
      #    그때는 재-plan 이 필요하다(=새 run).
      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\` — live/dev/networking"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
