# live/hub/eks: plan(main push) → 사람이 요약을 읽고 dispatch → plan → apply
#
# deploy-hub-network.yml과 같은 규약을 EKS 루트에 적용한다. 설계 원칙(dispatch가 승인, 한 워크플로
# 두 job, plan job에 environment 없음, apply는 tofu apply tfplan, destroy 경로)은 그 파일 헤더가
# 근거를 설명한다. 독립 배포를 위해 셋을 분리한다: 경로 필터 live/hub/eks/**(networking 변경은
# 이 워크플로를 트리거하지 않는다), state 키 hub/eks.tfstate, concurrency live-hub-eks(두 루트의
# apply가 서로를 취소하지 않는다).
#
# ⚠️ deletion_protection이 켜져 있으면 파기는 2단계다. false로 apply한 뒤 destroy한다. 모듈이
#    교차 검증하므로 한 번에 지울 수 없다.

name: deploy · live/hub/eks

on:
  push:
    branches: [main]
    paths:
      - live/hub/eks/**
      - .github/workflows/deploy-hub-eks.yml
  # merge 후 plan까지만 자동으로 돈다(요약은 run Summary 탭). apply는 아래 dispatch로만.
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기"
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: "destroy 일 때만 필수. 정확히 `destroy live/hub/eks` 를 입력한다"
        type: string
        default: ""
      # 재생성 경로. user_data는 부팅 시에만 돌기 때문에 부팅 당시 조건이 틀렸던 인스턴스는
      # apply로 고칠 수 없고 교체해야만 코드가 상태를 되찾는다.
      # ⚠️ 교체는 파괴를 포함하므로 plan 요약의 must be replaced로 승인자에게 드러난다.
      replace:
        description: "재생성할 리소스 주소(선택). 예: module.workbench.aws_instance.this"
        type: string
        default: ""

# state는 단일 자원이다. 두 run이 겹치면 lock 경합이거나, 더 나쁘게는 뒤늦은 run이 오래된
# plan을 적용한다.
# ⛔ cancel-in-progress는 false여야 한다. apply 중인 run을 취소하면 state와 실제가 갈라진다.
concurrency:
  group: live-hub-eks
  cancel-in-progress: false

env:
  TF_ROOT: live/hub/eks
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  # plan: main push와 dispatch 양쪽에서 돈다. environment를 선언하지 않는다. push run의 plan은
  # 사람이 읽으라고 도는 것이고, 적용은 그 요약을 읽은 사람이 dispatch를 눌렀을 때 그 run 안에서
  # 일어난다.
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC JWT 발급. 이게 없으면 1단 인증 자체가 안 된다
      contents: read
      # pull-requests: write는 두지 않는다. PR 댓글 step이 없으므로 필요 없는 쓰기 권한이다.

    steps:
      # destroy 확인 게이트. 공용 개발 계정이고 destroy는 되돌릴 수 없다. 루트 이름을 손으로
      # 적게 해 "누른 워크플로 = 지우려던 워크플로"를 사람이 스스로 확인하게 만든다.
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/hub/eks" ]; then
            echo "::error::destroy 하려면 confirm 에 정확히 'destroy live/hub/eks' 를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다: live/hub/eks"

      - uses: actions/checkout@v7.0.1

      # private repo 모듈 소싱 인증. 토큰은 1시간 만료이고 접근 범위는 iac-module-library
      # 1개다(repository_selection=selected).
      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      # 소싱 URL은 코드에서 git::https:// 하나다. 인증은 여기서만 주입된다. 코드가 인증 방식을
      # 모르는 것이 facade 원칙이다.
      # ⚠️ insteadOf 값에 토큰이 평문으로 들어간다. runner의 --global config는 일회용이라 run
      #    종료와 함께 사라진다(로컬에서 같은 명령을 ~/.gitconfig에 하면 안 되는 이유).
      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # OIDC 2단 체인의 1단. 입구 Role의 권한은 "실행 Role을 assume" 하나뿐이다. 정적 키는
      # 어디에도 없다.
      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-plan-${{ github.run_id }}

      # partial backend configuration. 버킷명이 코드에 없어 여기서 repo 변수로 조립한다.
      # ⚠️ backend는 provider와 독립적으로 자격증명을 해결한다. provider의 assume_role은 backend에
      #    적용되지 않고, 입구 Role의 권한은 sts:AssumeRole 하나뿐이라 그대로 두면 state를 읽다가
      #    403이 난다. backend에도 같은 실행 Role을 체인 assume 시켜야 "입구 Role의 권한은 assume
      #    하나뿐"이라는 신뢰 경계가 유지된다.
      # ⚠️ 파일로 넘긴다. -backend-config=KEY=VALUE는 문자열 값만 받아 assume_role 객체를 CLI
      #    플래그로 표현할 수 없다. backend.hcl은 .gitignore 대상이라 runner에 만들어도 커밋될 수 없다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔ registry 간
        # 네트워크 지연). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          # 2단째 assume 대상. ARN에 계정 ID가 있어 코드에 두지 않는다.
          TF_VAR_execution_role_arn: ${{ vars.HUB_AWS_EXEC_ROLE_ARN }}
          # argocd_hub_assumable_role_arns를 결정적으로 합성하는 데만 쓴다. 계정 ID라 코드에 두지 않는다.
          TF_VAR_spoke_account_id: ${{ vars.DEV_ACCOUNT_ID }}
        run: |
          # -detailed-exitcode: 0=변경없음 · 1=오류 · 2=변경있음. "두 번째 apply가 No changes인가"
          # (ignore_tags 판정)를 사람 눈이 아니라 종료 코드로 받기 위해 쓴다.
          # push 이벤트에는 inputs가 없다 → 빈 문자열이므로 자동으로 apply 경로다.
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          # 재생성. 비어 있으면 아무 영향이 없다. destroy와 겹칠 일은 없다(파기에 교체는 무의미).
          REPLACE=""
          if [ -n "${{ inputs.replace }}" ] && [ "${{ inputs.action }}" != "destroy" ]; then
            REPLACE="-replace=${{ inputs.replace }}"
            echo "::warning::재생성 계획: ${{ inputs.replace }}"
          fi

          set +e
          tofu plan $DESTROY $REPLACE -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # "삭제 대상은 사람이 검토한다"를 이행하는 지점. 공용 계정이라 예외가 없다. destroy/replace를
      # 전문 위로 끌어올려 스크롤하지 않아도 보이게 만든다. 요약은 $GITHUB_STEP_SUMMARY에 무조건
      # 쓰므로 push run·dispatch run 어느 쪽에서도 run의 Summary 탭에서 읽을 수 있다.
      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\`: live/hub/eks"
              echo
              echo "> **파기 계획이다.** 이 run 의 apply 를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\`: live/hub/eks"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ plan 파일에는 리소스 속성이 평문으로 들어간다. repo read 권한자가 받을 수 있으므로
      #    보관을 하루로 제한한다. 이는 완화이지 해결이 아니다.
      - name: plan artifact 업로드
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # apply: workflow_dispatch에서만. main push에서는 skip된다.
  apply:
    name: apply
    needs: plan
    # dispatch를 누르는 행위가 승인이다(맨 위 헤더). 상위 요금제로 옮겨 environment hub에
    # required reviewers를 걸 수 있게 되면 이 조건을 (push || workflow_dispatch)로 되돌린다.
    # ⚠️ 브랜치 조건을 여기 한 번 더 쓰는 이유: workflow_dispatch는 임의 브랜치에서 눌릴 수 있다.
    #    Environment의 deployment branch policy(main 하나)가 최종 방어선이지만, job 조건으로도
    #    막아 두면 실패가 아니라 skip으로 끝난다.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 이 한 줄이 두 가지를 동시에 한다: 승인 게이트(protection rules가 걸려 있을 때)와 OIDC
    # sub를 ...:environment:hub로 바꾸는 것(입구 Role 신뢰 정책의 SUB_ENV_HUB 패턴).
    # ⚠️ environment는 sub에서 ref를 덮어쓴다. 그래서 브랜치 제한을 sub로 걸 수 없고 Environment의
    #    deployment branch policy가 그 자리를 맡는다.
    environment: hub
    permissions:
      id-token: write
      contents: read

    steps:
      # 1~4단계는 plan job과 같다. 자격증명은 job 간에 이동하지 않으므로 재수행한다(중복이 아니라
      # 격리). 승인 대기 중 세션(최대 1시간, 연장 불가)이 만료돼도 apply job이 새로 인증하므로
      # 승인 지연 자체는 문제가 되지 않는다.
      - uses: actions/checkout@v7.0.1

      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-apply-${{ github.run_id }}

      # plan job과 같은 이유로 backend도 실행 Role을 체인 assume한다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        # provider 바이너리 다운로드가 일시적으로 타임아웃되는 경우가 있다(runner ↔ registry 간
        # 네트워크 지연). 재시도로 흡수한다.
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      # 같은 run의 artifact다. run 경계를 넘지 않는 것이 이 설계의 핵심이다.
      - name: plan artifact 내려받기
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      # ⛔ tofu apply(인자 없이)로 바꾸면 재-plan이 되어 승인 대상과 달라진다. TF_VAR_*를 여기
      #    넘기지 않는다. 저장된 plan은 변수 값을 이미 품고 있고, 다시 넘기면 "승인한 계획"의
      #    정의가 흐려진다.
      # ⚠️ 승인 대기 중 state가 바뀌었으면 이 명령이 거부한다(정상 동작). 그때는 재-plan이
      #    필요하다(=새 run).
      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\`: live/hub/eks"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-eks-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
