# live/hub/tgw — plan → (사람이 실행) → plan → apply
#
# `deploy-hub-network.yml`을 그대로 복제했다 — 이 워크플로의 모든 설계 원칙(한 워크플로
# 두 job · plan job에 environment 없음 · apply는 tofu apply tfplan · destroy 확인 게이트 등)
# 은 그 파일의 상단 주석이 근거를 자세히 설명한다. 여기 반복하지 않는다.
#
# ⚠️ **이 워크플로는 `deploy-hub-network.yml`보다 먼저 dispatch돼야 한다.** GitHub Actions는
#    별도 워크플로 파일 사이에 `needs:`로 순서를 강제할 수 없다 — hub를 처음부터 세울 때
#    (부트스트랩 이후) 이 워크플로의 apply가 끝난 뒤에 사람이 `deploy-hub-network.yml`을
#    dispatch한다. 순서를 어기면 그 워크플로의 spoke 자동 발견 로직이
#    `Invalid for_each argument`로 실패한다(TGW가 아직 없어서).

name: deploy · live/hub/tgw

on:
  push:
    branches: [main]
    paths:
      - live/hub/tgw/**
      - .github/workflows/deploy-hub-tgw.yml
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기"
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: "destroy 일 때만 필수. 정확히 `destroy live/hub/tgw` 를 입력한다"
        type: string
        default: ""

concurrency:
  group: live-hub-tgw
  cancel-in-progress: false

env:
  TF_ROOT: live/hub/tgw
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/hub/tgw" ]; then
            echo "::error::destroy 하려면 confirm 에 정확히 'destroy live/hub/tgw' 를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다 — live/hub/tgw"

      - uses: actions/checkout@v7.0.1

      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-plan-tgw-${{ github.run_id }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/tgw.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3) — 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_execution_role_arn: ${{ vars.HUB_AWS_EXEC_ROLE_ARN }}
          TF_VAR_spoke_account_id: ${{ vars.DEV_ACCOUNT_ID }}
        run: |
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          set +e
          tofu plan $DESTROY -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\` — live/hub/tgw"
              echo
              echo "> **파기 계획이다.** 이 run 의 apply 를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\` — live/hub/tgw"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: plan artifact 업로드
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hub
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-apply-tgw-${{ github.run_id }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/tgw.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3) — 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: plan artifact 내려받기
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 후 수렴 검증 (읽기 전용 재-plan)
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_execution_role_arn: ${{ vars.HUB_AWS_EXEC_ROLE_ARN }}
          TF_VAR_spoke_account_id: ${{ vars.DEV_ACCOUNT_ID }}
        run: |
          DESTROY=""
          [ "${{ inputs.action }}" = "destroy" ] && DESTROY="-destroy"

          set +e
          tofu plan $DESTROY -no-color -lock-timeout=5m -detailed-exitcode -refresh=true
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::error::apply 직후인데 재-plan 이 여전히 변경사항을 보고한다 — 일부 리소스가 반영되지 않았을 가능성이 높다. AWS 콘솔/CLI로 실물을 직접 대조할 것."
            exit 1
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\` — live/hub/tgw"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
