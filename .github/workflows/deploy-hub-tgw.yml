# live/hub/tgw: plan(main push) → 사람이 그 run의 요약을 읽고 승인 → 같은 run이 apply
#
# 설계 원칙(한 워크플로 두 job, plan job에 environment 없음, apply는 tofu apply tfplan, destroy
# 확인 게이트)은 deploy-hub-network.yml 헤더가 근거를 설명한다. 여기 반복하지 않는다.
#
# ⚠️ 이 워크플로의 apply가 deploy-hub-network.yml보다 먼저 승인돼야 한다. GitHub Actions는 별도
#    워크플로 파일 사이에 needs:로 순서를 강제할 수 없다. hub를 처음부터 세울 때 이 워크플로의
#    apply가 끝난 뒤에 deploy-hub-network.yml의 apply를 승인한다. 순서를 어기면 그 워크플로의
#    spoke 자동 발견 for_each가 Invalid for_each argument로 실패한다(TGW가 아직 없어서).

name: deploy · live/hub/tgw

on:
  push:
    branches: [main]
    paths:
      - live/hub/tgw/**
      - .github/workflows/deploy-hub-tgw.yml
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기 / plan = 확인만(적용하지 않는다)"
        type: choice
        options: [apply, destroy, plan]
        default: apply
      confirm:
        description: "destroy 일 때만 필수. 정확히 `destroy live/hub/tgw` 를 입력한다"
        type: string
        default: ""

concurrency:
  group: live-hub-tgw
  cancel-in-progress: false

env:
  TF_ROOT: live/hub/tgw
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      # apply 가드가 읽는다. plan 스텝이 -detailed-exitcode 로 판정한 값이다.
      changes: ${{ steps.plan.outputs.changes }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/hub/tgw" ]; then
            echo "::error::destroy 하려면 confirm 에 정확히 'destroy live/hub/tgw' 를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다: live/hub/tgw"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다. 기본값 true 는 tofu 호출을 래퍼로 감싸 stdout·stderr·exitcode 를
      #    스텝 출력으로 내보내는데, 그 과정에서 -detailed-exitcode 의 2 가 스텝 종료 코드로
      #    전달되지 않는다. 아래 plan 스텝이 code=0 으로 읽어 changes=false 를 내보내고, 변경이
      #    있어도 apply 가 skipped 로 끝난다. 액션 문서도 exit code 가 이상하면 이 값을 false 로
      #    두라고 적는다. verify.yml 이 같은 값을 쓴다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-plan-tgw-${{ github.run_id }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/tgw.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_execution_role_arn: ${{ vars.HUB_AWS_EXEC_ROLE_ARN }}
          TF_VAR_spoke_account_id: ${{ vars.DEV_ACCOUNT_ID }}
        run: |
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          set +e
          tofu plan $DESTROY -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\`: live/hub/tgw"
              echo
              echo "> **파기 계획이다.** 이 run 의 apply 를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\`: live/hub/tgw"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            if [ "${{ inputs.action }}" = "plan" ]; then
              echo
              echo "> 확인 전용 실행이다(\`action=plan\`). 변경이 있어도 apply 하지 않는다."
            fi
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: plan artifact 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    # 승인 게이트는 environment의 required reviewers다. push든 dispatch든 plan 뒤에 멈춘다.
    # ⚠️ 브랜치 조건: workflow_dispatch는 임의 브랜치에서 눌릴 수 있다. Environment의 deployment
    #    branch policy(main 하나)가 최종 방어선이지만, job 조건으로도 막아 두면 실패가 아니라
    #    skip으로 끝난다.
    # ⚠️ changes 가드: 변경 0건이면 apply 를 건너뛴다. 빈 승인 클릭을 없애고, 승인 게이트가
    #    섰다는 사실 자체를 "적용할 것이 있다"는 신호로 만든다. destroy 는 항상 changes=true 다.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.plan.outputs.changes == 'true'
      && inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: hub
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다(plan job 과 같은 근거). 이 job 의 apply 후 수렴 검증도
      #    -detailed-exitcode 로 판정하므로, 래퍼가 켜져 있으면 미수렴을 잡지 못한다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.HUB_AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-apply-tgw-${{ github.run_id }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.HUB_TF_STATE_BUCKET }}"
          key          = "hub/tgw.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.HUB_AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: plan artifact 내려받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 후 수렴 검증 (읽기 전용 재-plan)
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_execution_role_arn: ${{ vars.HUB_AWS_EXEC_ROLE_ARN }}
          TF_VAR_spoke_account_id: ${{ vars.DEV_ACCOUNT_ID }}
        run: |
          DESTROY=""
          [ "${{ inputs.action }}" = "destroy" ] && DESTROY="-destroy"

          set +e
          tofu plan $DESTROY -no-color -lock-timeout=5m -detailed-exitcode -refresh=true
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::error::apply 직후인데 재-plan 이 여전히 변경사항을 보고한다. 일부 리소스가 반영되지 않았을 가능성이 높다. AWS 콘솔/CLI로 실물을 직접 대조할 것."
            exit 1
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\`: live/hub/tgw"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
