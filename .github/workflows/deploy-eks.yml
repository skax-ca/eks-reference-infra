# live/dev/eks — plan → (사람이 실행) → plan → apply
#
# networking 의 deploy.yml 과 **같은 규약**을 EKS 루트에 적용한다. 독립 배포를 위해 셋을 분리한다:
#   · 경로 필터    : live/dev/eks/** (networking 변경은 이 워크플로를 트리거하지 않는다)
#   · state 키     : dev/eks.tfstate (backend 조립 step)
#   · concurrency  : live-dev-eks (두 루트의 apply 가 서로를 취소하지 않는다)
#
# ── D30-1 형태(2026-08-03): PR plan 제거 + apply 는 workflow_dispatch 전용 ─────
# 이유는 deploy.yml 상단과 같다: PR/merge 에서 plan 을 두 번 도는 낭비를 없앴고, free 플랜이라
# environment 에 required reviewers 를 못 걸어 **dispatch 를 누르는 행위가 승인을 대신한다**.
# ⚠️ merge 만으로는 apply 되지 않는다 — plan 요약(destroy/replace)을 읽고 Run workflow 를 누른다.
#
# ⛔ 한 워크플로 두 job 을 유지한다(design/50 §3). 별도 apply 워크플로로 쪼개면 plan artifact 를
#    run 경계 밖에서 찾아야 하고 그 조회 지점이 "승인한 계획 ≠ 적용된 계획" 구멍이다.
# ⛔ plan job 에 environment: 를 붙이지 않는다(D28). environment 를 선언한 job 만 OIDC sub 에
#    :environment:<name> 을 받는다 — 입구 Role 신뢰 정책 3패턴과 어긋난다.
# ⛔ apply 를 인자 없는 tofu apply(재-plan)로 바꾸지 않는다. 승인한 것과 다른 것을 적용하게 된다.

name: deploy · live/dev/eks

on:
  push:
    branches: [main]
    paths:
      - live/dev/eks/**
      - .github/workflows/deploy-eks.yml
  # merge 후 plan 까지만 자동으로 돈다(요약은 run Summary 탭). apply 는 아래 dispatch 로만.
  workflow_dispatch:

concurrency:
  group: live-dev-eks
  cancel-in-progress: false

env:
  TF_ROOT: live/dev/eks
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # plan — main push 와 dispatch 양쪽에서 돈다. environment 를 선언하지 않는다(D28).
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC JWT 발급
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      # ── D20 · private repo 모듈 소싱 인증 (eks-cluster 태그를 받는다) ────────
      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # ── OIDC 2단 체인 · 1단 (입구 Role) ────────────────────────────────────
      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-plan-${{ github.run_id }}

      # ── D25 · partial backend + D30 · backend 도 실행 Role 체인 assume ──────
      # backend 는 provider 와 독립적으로 자격증명을 해결한다(공식). 입구 Role 권한은 assume 하나뿐이라
      # 여기서 실행 Role 을 assume 시키지 않으면 state 를 읽다가 403 이 난다.
      # ⚠️ state 키가 networking 과 다르다 — dev/eks.tfstate.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: tofu init -backend-config=backend.hcl

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          # 2단째 assume 대상. ARN 에 계정 ID 가 있어 코드에 두지 않는다(D25 의 연장).
          TF_VAR_execution_role_arn: ${{ vars.AWS_EXEC_ROLE_ARN }}
          # ⛔ `TF_VAR_public_access_cidrs` 는 **삭제됐다**(2026-08-06, private-only 전환).
          #    변수가 사라졌으니 주입 지점도 함께 지운다 — 죽은 경로를 남기지 않는다.
          #    repo 변수 `EKS_PUBLIC_ACCESS_CIDRS` 자체도 정리 대상이다(GitHub 설정 쪽).
        run: |
          set +e
          tofu plan -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # ── D27-2 · "삭제 대상 사람 검토"를 이행하는 지점 (공용 계정, 예외 없음) ──
      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            echo "### \`tofu plan\` — live/dev/eks"
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> 공용 개발 계정이다. 이 목록은 승인 전에 **사람이 읽는다**(D27-2)."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ plan 파일에는 리소스 속성이 평문으로 들어간다. 보관을 하루로 제한한다(design/50 §3).
      - name: plan artifact 업로드
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # apply — workflow_dispatch 에서만(D30-1). main push 에서는 skip 된다.
  # dispatch 를 누르는 행위가 승인이다(free 플랜이라 required reviewers 를 못 건다).
  # ────────────────────────────────────────────────────────────────────────────
  apply:
    name: apply
    needs: plan
    # 🔑 상위 요금제 구독 시: 조건을 (push || workflow_dispatch)로 되돌리고 environment dev 에
    #    required reviewers 를 건다(deploy.yml 상단 "되돌릴 것"과 동일).
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ⚠️ 이 한 줄이 승인 게이트(protection rules)와 OIDC sub 를 :environment:dev 로 바꾸는 일을 동시에 한다.
    #    environment 는 sub 에서 ref 를 덮어쓰므로(Phase 2 실측) 브랜치 제한은 deployment branch policy 가 맡는다.
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      # 1~4단계는 plan job 과 같다. 자격증명은 job 간 이동하지 않으므로 재수행한다(중복이 아니라 격리).
      - uses: actions/checkout@v7.0.1

      - name: 모듈 repo 읽기 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_KEY }}
          owner: skax-ca
          repositories: iac-module-library

      - name: git insteadOf 주입
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: AWS 인증 (입구 Role)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ENTRY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-eks-apply-${{ github.run_id }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/eks.tfstate"
          region       = "ap-northeast-2"
          use_lockfile = true

          assume_role = {
            role_arn     = "${{ vars.AWS_EXEC_ROLE_ARN }}"
            session_name = "tofu-eks-backend-${{ github.run_id }}"
          }
          EOF

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: tofu init -backend-config=backend.hcl

      # **같은 run** 의 artifact 다. run 경계를 넘지 않는 것이 이 설계의 핵심이다.
      - name: plan artifact 내려받기
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-eks-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      # ⛔ 인자 없는 tofu apply(재-plan)로 바꾸지 않는다. ℹ️ TF_VAR_* 를 넘기지 않는다 —
      #    저장된 plan 이 변수 값을 이미 품고 있고 다시 넘기면 "승인한 계획"의 정의가 흐려진다.
      # ⚠️ 승인 대기 중 state 가 바뀌었으면 이 명령이 거부한다 — 정상 동작이다(새 run 필요).
      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\` — live/dev/eks"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\` 의 artifact \`tfplan-eks-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
