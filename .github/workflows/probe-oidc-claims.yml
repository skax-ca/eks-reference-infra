# ⚠️ THROWAWAY — Phase 2 실측 전용. 측정이 끝나면 **삭제한다**(커밋으로).
#
# 목적: OIDC 신뢰 정책에 넣을 `sub` claim 의 실제 형태를 확정한다.
# 왜 지금인가: 추정으로 신뢰 정책을 쓰면 실패했을 때 원인이 aud 인지 sub 인지
#             provider ARN 인지 구분되지 않는다. 그래서 Phase 2 가 Phase 3 보다 앞에 있다.
#
# AWS 리소스가 전혀 필요 없다 — GitHub 이 발급한 JWT 를 그대로 디코드할 뿐이다.
#
# 측정 대상 3패턴 (design/50 D28):
#   ① pull_request                → PR plan job
#   ② ref:refs/heads/main         → main plan job
#   ③ environment:dev             → apply job (environment 를 선언한 job 만 받는다)
name: probe-oidc-claims

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # JWT 발급에 필수
  contents: read

jobs:
  # ① pull_request  ② ref:refs/heads/main — environment 를 선언하지 않는다
  no-environment:
    name: "sub 측정 — environment 없음"
    runs-on: ubuntu-latest
    steps:
      - name: JWT claim 출력
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # ⚠️ 원시 토큰은 출력하지 않는다. 그 자체가 자격증명이다
          #    (지금은 신뢰 정책이 없어 무력하지만, 습관을 여기서 들인다).
          RAW=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          OIDC_TOKEN="$RAW" python3 - <<'PY'
          import base64, json, os
          p = os.environ["OIDC_TOKEN"].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("=" * 70)
          print(f"event = {os.environ.get('EVENT','?')}   job = no-environment")
          print("=" * 70)
          print(f"  sub = {c.get('sub')}")
          print(f"  aud = {c.get('aud')}")
          print(f"  iss = {c.get('iss')}")
          print("-" * 70)
          for k in ("repository", "repository_id", "repository_owner",
                    "repository_owner_id", "ref", "environment",
                    "job_workflow_ref", "workflow_ref", "event_name"):
              print(f"  {k:22} = {c.get(k)}")
          print("-" * 70)
          print("  전체 claim 키:", sorted(c.keys()))
          PY

  # ③ environment:dev — environment 를 선언한 job 만 :environment: 를 받는다(D28 의 요점)
  #    PR 에서는 돌리지 않는다. 실제 apply job 도 PR 에서 돌지 않으므로 측정 의미가 없고,
  #    PR 이 environment 를 참조하는 패턴 자체를 만들지 않는 편이 안전하다.
  with-environment:
    name: "sub 측정 — environment: dev"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: JWT claim 출력
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RAW=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          OIDC_TOKEN="$RAW" python3 - <<'PY'
          import base64, json, os
          p = os.environ["OIDC_TOKEN"].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("=" * 70)
          print(f"event = {os.environ.get('EVENT','?')}   job = with-environment (dev)")
          print("=" * 70)
          print(f"  sub = {c.get('sub')}")
          print(f"  aud = {c.get('aud')}")
          print("-" * 70)
          for k in ("repository", "repository_id", "repository_owner",
                    "repository_owner_id", "ref", "environment",
                    "job_workflow_ref", "workflow_ref", "event_name"):
              print(f"  {k:22} = {c.get(k)}")
          print("-" * 70)
          print("  전체 claim 키:", sorted(c.keys()))
          PY
